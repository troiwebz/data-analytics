name: fetch-clip
on:
  push:
    branches:
      - claude/restaurant-mobile-video-clip-3dco4w
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download assets and commit
        run: |
          if [ -f static/venus-hook-12s.mp4 ]; then echo "already present"; exit 0; fi
          curl -fL --retry 3 -o static/venus-hook-12s.mp4 "https://d2ol7oe51mr4n9.cloudfront.net/user_3ACUUhtoR0ZmAfx0ZlBgxsUibVg/d9497395-a9d3-45f3-908b-de430003cbd2.mp4"
          curl -fL --retry 3 -o static/venus-hook-preview.png "https://d2ol7oe51mr4n9.cloudfront.net/user_3ACUUhtoR0ZmAfx0ZlBgxsUibVg/fd947c24-0b3d-40b8-97ab-e7041ae2ae66.png"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f static/venus-hook-12s.mp4 static/venus-hook-preview.png
          git commit -m "Add Venus Venture hook clip and preview [skip ci]"
          git push
