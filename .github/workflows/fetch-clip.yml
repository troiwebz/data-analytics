name: fetch-clip
on:
  push:
    branches:
      - claude/restaurant-mobile-video-clip-3dco4w
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download assets and commit
        run: |
          if [ -f static/destin-hero-6s.mp4 ]; then echo "already present"; exit 0; fi
          curl -fL --retry 3 -o static/destin-hero-6s.mp4 "https://d2ol7oe51mr4n9.cloudfront.net/user_3ACUUhtoR0ZmAfx0ZlBgxsUibVg/6d0846e5-7b84-493c-ac03-749573e26f60.mp4"
          curl -fL --retry 3 -o static/destin-hero-site/preview.png "https://d2ol7oe51mr4n9.cloudfront.net/user_3ACUUhtoR0ZmAfx0ZlBgxsUibVg/5e657eb4-1f9b-4cb3-a8f0-86c3e7fcf71f.png"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f static/destin-hero-6s.mp4 static/destin-hero-site/preview.png
          git commit -m "Update hero clip and preview to v2 [skip ci]"
          git push
