<!doctype html>
<meta charset="utf-8">
<title>HAF Watcher — Your service threads</title>
<style>
  :root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--blue:#2563eb;--green:#16a34a;--amber:#d97706;--red:#dc2626}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
  header{position:sticky;top:0;z-index:5;background:#0f172a;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0 10px 0 0}
  header .sp{flex:1}
  button{padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font:600 13px system-ui;cursor:pointer;color:var(--ink)}
  button:hover{filter:brightness(.96)}
  button:disabled{opacity:.55;cursor:default}
  header button{background:#1e293b;color:#fff;border-color:#334155}
  header button.pri{background:var(--blue);border-color:var(--blue)}
  .w{max-width:920px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:18px}
  .card h2{font-size:15px;margin:0 0 2px}
  .card p.sub{margin:0 0 14px;color:var(--mute);font-size:12.5px}
  textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:10px;
           font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}
  .row{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .msg{font-size:12.5px;color:var(--mute)}
  .msg.ok{color:var(--green)}.msg.err{color:var(--red)}
  .thread{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
  .thread .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
  .thread .label{font-weight:700;font-size:14px}
  .thread a{color:var(--blue);text-decoration:none;font-size:12.5px}
  .thread a:hover{text-decoration:underline}
  .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
  .pill.ready{background:#dcfce7;color:#15803d}
  .pill.wait{background:#fef3c7;color:#b45309}
  .meta{color:var(--mute);font-size:12px;margin-top:4px}
  .idea{margin-top:10px;padding:10px 12px;background:#f8fafc;border-left:3px solid var(--blue);border-radius:6px;
        font-size:13px;white-space:pre-wrap;display:none}
  .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .acts button{font-size:12.5px;padding:6px 10px}
  .empty{padding:40px 0;text-align:center;color:var(--mute)}
</style>
<header>
  <h1>Your BHW service threads</h1>
  <span class="sp"></span>
  <button id="back" class="pri">Back to the leads</button>
</header>
<div class="w">
  <div class="card">
    <h2>Add threads by pasting links</h2>
    <p class="sub">One or more BHW thread URLs, any way you paste them — the title is read from each thread itself.</p>
    <textarea id="bulkTrack" placeholder="https://www.blackhatworld.com/seo/your-thread.123456/&#10;https://www.blackhatworld.com/seo/another-thread.654321/"></textarea>
    <div class="row"><button id="bulkTrackBtn" class="pri">Add tracked threads</button>
      <span id="bulkTrackStatus" class="msg"></span></div>
  </div>
  <div class="card">
    <h2>Tracked threads</h2>
    <p class="sub" id="sub">Held to BHW's own bump rule — a genuine reply every 24h, a plain bump every 72h.</p>
    <div id="list"></div>
  </div>
</div>
<script type="module" src="services.js"></script>
