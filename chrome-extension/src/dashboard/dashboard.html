<!doctype html>
<meta charset="utf-8">
<title>HAF Watcher</title>
<style>
  :root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--blue:#2563eb;--green:#16a34a;--amber:#d97706;--red:#dc2626}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
  header{position:sticky;top:0;z-index:5;background:#0f172a;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0 10px 0 0}
  header h1 small{font-weight:400;opacity:.6;font-size:12px}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;background:#64748b}
  .dot.on{background:#22c55e}
  header .sp{flex:1}
  button{padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font:600 13px system-ui;cursor:pointer;color:var(--ink)}
  button:hover{filter:brightness(.96)}
  header button{background:#1e293b;color:#fff;border-color:#334155}
  header button.pri{background:var(--blue);border-color:var(--blue)}
  button.go{background:var(--green);color:#fff;border-color:var(--green)}
  button.warn{background:#fff7ed;border-color:#fed7aa;color:#9a3412}
  .stats{display:flex;gap:10px;padding:14px 20px 10px;flex-wrap:wrap}
  .k{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 16px;min-width:104px}
  .k b{display:block;font-size:20px}.k span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
  .tools{display:flex;gap:10px;align-items:center;padding:0 20px 12px;flex-wrap:wrap}
  .tools input{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font:13px system-ui;min-width:260px}
  #cmd{font:11px ui-monospace,Menlo,monospace;background:#1e293b;color:#cbd5e1;padding:6px 10px;border-radius:6px;cursor:pointer;border:1px solid #334155}
  .wrap{padding:0 20px 40px}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th{background:#f8fafc;border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;font-size:12px;
     text-transform:uppercase;letter-spacing:.04em;color:var(--mute);white-space:nowrap}
  th.s{cursor:pointer;user-select:none}
  th.s:hover{color:var(--ink);background:#f1f5f9}
  th .ar{opacity:.35;font-size:10px}
  th.on{color:var(--blue)} th.on .ar{opacity:1}
  td{border-bottom:1px solid #f1f5f9;padding:9px 10px;vertical-align:top}
  .meter{display:inline-flex;flex-direction:column;gap:6px;min-width:132px;padding:7px 11px 8px;
    border:1px solid rgba(255,255,255,.14);border-radius:9px;background:rgba(255,255,255,.05)}
  .mtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    font-size:11px;letter-spacing:.04em;text-transform:uppercase;opacity:.7}
  .mtop b{font-size:12.5px;font-weight:700;letter-spacing:0;opacity:1;font-variant-numeric:tabular-nums}
  .mbar{display:block;height:4px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden}
  .mbar i{display:block;height:100%;border-radius:99px;transition:width .35s ease}
  tr.r{cursor:pointer} tr.r:hover td{background:#f8fafc}
  .ch{display:inline-block;width:12px;color:var(--mute);font-size:11px}
  .ext{text-decoration:none;color:var(--mute);font-size:12px;padding:0 4px;border-radius:4px}
  .ext:hover{color:var(--blue);background:#eff6ff}
  /* Posted is done: strike the title so a glance down the table shows what is
     handled. Skipped and expired are dimmed but not struck — different meaning. */
  tr.posted .t{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:#16a34a;color:var(--mute)}
  tr.pmdone .t{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:#2563eb;color:var(--mute)}
  tr.pmdone td{background:#f8fbff}
  tr.pmdone:hover td{background:#eff6ff}
  tr.posted td{background:#f6fdf8}
  tr.posted:hover td{background:#eefbf3}
  tr.dim td{opacity:.55}
  tr.dim:hover td{opacity:.8}
  tr.hot td:first-child{box-shadow:inset 3px 0 0 #f97316}
  tr.warm td:first-child{box-shadow:inset 3px 0 0 #eab308}
  .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .t{font-weight:600;color:var(--ink);text-decoration:none}
  tr.r:not(.posted):not(.pmdone):hover .t{text-decoration:underline;text-decoration-color:#cbd5e1}
  .t:hover{color:var(--blue)}
  .sub{color:var(--mute);font-size:12px}
  .st{display:inline-block;font-size:10px;padding:2px 7px;border-radius:99px;background:#e2e8f0;text-transform:uppercase;font-weight:700}
  .POSTED{background:#dcfce7;color:#15803d}.FAILED{background:#fee2e2;color:#b91c1c}.SKIPPED{background:#f1f5f9;color:#64748b}
  .BACKFILL{background:#e0e7ff;color:#3730a3}.APPROVED{background:#fef3c7;color:#b45309}.EXPIRED{background:#f3f4f6;color:#6b7280}
  .stale{color:var(--red);font-weight:600}
  .approx{font-size:10px;color:var(--amber)}
  .detail td{background:#f8fafc;padding:14px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:860px){.cols{grid-template-columns:1fr}}
  .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:0 0 4px}
  textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:8px;padding:10px;
           font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical;background:#fff}
  textarea.dm{background:#fffbeb}
  .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .snip{background:#fff;border-left:3px solid var(--line);padding:10px;white-space:pre-wrap;font-size:13px;margin-bottom:12px}
  .msg{font-size:12px;margin-top:6px;min-height:16px}
  .msg.ok{color:var(--green)}.msg.err{color:var(--red)}
  .empty{padding:50px;text-align:center;color:var(--mute)}
  #log{padding:16px 20px 30px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#475569}
  #log div.error{color:var(--red)}
</style>
<header>
  <h1>HAF Watcher <small id="ver"></small></h1>
  <span><span class="dot" id="dot"></span><span id="state">…</span></span>
  <span id="rate" style="display:inline-flex;align-items:center;gap:10px"></span>
  <span class="sp"></span>
  <button id="poll" class="pri" title="Read the forum right now instead of waiting for the next automatic check">Check for new threads</button>
  <button id="update" class="pri" title="Reload the extension after pulling new code">Install update</button>
  <button id="approvals" title="Anything you tapped Post on in Telegram">Run approved posts</button>
  <button id="sync" title="Pull the newest rows from your Google Sheet into this table">Load from Sheet</button>
  <button id="backfill" title="Record the last two days of threads, without sending anything">Load last 48h</button>
  <button id="deep" title="Walk the forum pages and record older threads too">Load older threads…</button>
  <button id="regen" title="Regenerate every draft from the current templates">Rebuild drafts</button>
  <button id="opts">Settings</button>
</header>
<div class="stats" id="stats"></div>
<div class="tools">
  <input id="q" placeholder="Search title, author, keyword…">
  <select id="fstatus" style="padding:7px 10px;border:1px solid var(--line);border-radius:8px;font:13px system-ui">
    <option value="">All</option>
    <option value="SENT">To do</option>
    <option value="APPROVED">Queued</option>
    <option value="POSTED">Posted</option>
    <option value="SKIPPED">Skipped</option>
    <option value="FAILED">Failed</option>
    <option value="BACKFILL">History</option>
    <option value="EXPIRED">Too late</option>
  </select>
  <label style="font-size:13px;color:var(--mute)"><input type="checkbox" id="hidedone"> hide posted / skipped</label>
  <span id="count" style="font-size:12.5px;color:var(--mute)"></span>
  <span class="sp" style="flex:1"></span>
  <button id="cmd" title="Copy — paste in Terminal to pull the newest code">bash ~/haf-watcher/tools/update.sh</button>
  <span id="cmdmsg" style="font-size:12px;color:var(--green)"></span>
</div>
<div class="wrap">
  <table>
    <thead><tr id="head"></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<div id="log"></div>
<script type="module" src="dashboard.js"></script>
